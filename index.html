<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo Anh Đẹp Trai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Nền đen nhám pha xanh đêm nam tính */
            background: radial-gradient(circle at center, #112233 0%, #070b12 70%, #020305 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Lưới kim loại chìm phía sau */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: 1;
        }

        /* Khung chứa chữ chính */
        .hero-box {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            animation: slamIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Chữ siêu to, in hoa, hiệu ứng kim loại phát sáng */
        .main-title {
            font-size: clamp(3.5rem, 11vw, 9.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.1;
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #a2d9ff 50%, #0099ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 0px #062540) 
                    drop-shadow(0 0 35px rgba(0, 174, 255, 0.75));
            animation: pulseGlow 2s ease-in-out infinite alternate;
            user-select: none;
            cursor: pointer;
        }

        /* Đường gạch chân ánh sáng xanh */
        .glow-line {
            width: 80%;
            height: 6px;
            margin: 25px auto 0;
            background: linear-gradient(90deg, transparent, #00e5ff, #ffffff, #00e5ff, transparent);
            border-radius: 10px;
            box-shadow: 0 0 20px #00e5ff, 0 0 40px #0088ff;
        }

        @keyframes slamIn {
            0% {
                opacity: 0;
                transform: scale(2.5) translateY(-40px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 10px 0px #062540) 
                        drop-shadow(0 0 25px rgba(0, 174, 255, 0.6));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 12px 0px #062540) 
                        drop-shadow(0 0 55px rgba(0, 229, 255, 1));
                transform: scale(1.03);
            }
        }

        canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="sparks"></canvas>

    <div class="hero-box" onclick="kichHoatNo()">
        <h1 class="main-title">BẢO ANH<br>ĐẸP TRAI</h1>
        <div class="glow-line"></div>
    </div>

    <script>
        // Hiệu ứng hạt tia lửa điện bay lên ở nền
        const canvas = document.getElementById('sparks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speedY: Math.random() * 1.5 + 0.5,
                speedX: (Math.random() - 0.5) * 1,
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;
                if (p.y < 0) {
                    p.y = canvas.height;
                    p.x = Math.random() * canvas.width;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 229, 255, ${p.opacity})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00e5ff';
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Khi bấm vào chữ sẽ rung nhẹ
        function kichHoatNo() {
            const box = document.querySelector('.hero-box');
            box.style.animation = 'none';
            void box.offsetWidth;
            box.style.animation = 'slamIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

</body>
</html>
